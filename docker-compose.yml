version: '3.8'

services:
  amamiya-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amamiya-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./public:/app/public
    networks:
      - proxy_net

networks:
  proxy_net:
    external: true